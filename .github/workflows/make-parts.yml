name: Make TikTok parts

# Movies arrive from the laptop helper as draft releases ("incoming-..."; drafts are only visible
# to people with write access), finished parts go back the same way ("parts-..."). No Google Drive.
# All cutting settings (modes, flips, cockroach, quality...) live in config/settings.json,
# which the iPhone app edits. To override one just for this workflow, add it under "env:"
# below with its old name, e.g.  MODES: "stretch"
#
# Secrets (GitHub > repo > Settings > Secrets and variables > Actions):
#   NTFY_TOPIC         your ntfy notification name (phone notifications). Without it, no notifications.
#   ANTHROPIC_API_KEY  optional: only used if story_model is set to a Claude model. By default the narration
#                      is written by a small free model (story_model, e.g. gemma3:4b) running on this runner.

on:
  schedule:
    - cron: "17 14 * * *"   # once a day, about 3am New Zealand time, in case a start was missed
  workflow_dispatch:         # the laptop helper (after sending a movie) and the app start it this way

concurrency:
  group: make-parts
  cancel-in-progress: false

permissions:
  contents: write            # read/write the draft releases (movies in, parts out) and the "status" branch
  actions: write             # start a follow-up run when a long movie needs more than one 6-hour run

jobs:
  make-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read settings
        run: python3 -c "import settings; s = settings.load(); print('WHISPER_MODEL=' + str(s['whisper_model'])); print('STORY_MODEL=' + str(s['story_model']))" >> "$GITHUB_ENV"

      - name: Keep the speech model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Install the subtitle maker (Whisper), preview encryption, story planner and narrator voice
        run: pip install faster-whisper cryptography "opencv-python-headless>=4.8,<5" anthropic edge-tts gradio_client

      - name: Keep the story model and music between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            assets/music/*.mp3
          key: story-${{ env.STORY_MODEL }}-${{ hashFiles('assets/music/tracks.json') }}
          restore-keys: story-${{ env.STORY_MODEL }}-

      - name: Start the story writer (small free AI model, no API key)
        if: ${{ !startsWith(env.STORY_MODEL, 'claude') }}
        continue-on-error: true      # without it, the narrated modes are skipped (with a notification)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS=$HOME/.ollama/models nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          OLLAMA_MODELS=$HOME/.ollama/models ollama pull "$STORY_MODEL"

      - name: Get the background music
        continue-on-error: true
        run: python3 story.py --get-music

      - name: Make parts
        run: python3 process.py

      - name: Tell my phone if something broke
        if: failure() || cancelled()
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Movie run stopped" -H "Tags: warning" \
            -d "The GitHub run failed or was cancelled. Open the GitHub app > movie-splitter-v2 > Actions to see why." \
            "https://ntfy.sh/$NTFY_TOPIC" || true
