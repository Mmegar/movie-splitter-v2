name: Check Drive login (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: '1IQK7I_n3ug3tC263Q-D_5MNHQPvfnzaT'
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
    steps:
      - name: Prepare Drive login
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json, os
          import re
          raw = os.environ.get("RT", "").strip().replace("\\\"", "\"")   # undo \" escaping
          m = re.search(r'"?refresh_token"?\s*[:=]\s*"([^"]+)"', raw)   # pulled out of any pasted token text
          rt = (m.group(1) if m else raw).strip().strip('"')
          print("::add-mask::" + rt, file=__import__("sys").stderr)
          tok = {"access_token": "", "token_type": "Bearer", "refresh_token": rt,
                 "expiry": "2000-01-01T00:00:00Z"}
          print("RCLONE_CONFIG_GDRIVE_TOKEN=" + json.dumps(tok))
          print("DRIVE_RT_INFO=len%d_%s" % (len(rt), "ok" if rt.startswith("1//") else "odd"))
          PY

      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Diagnose (never prints the token)
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
        run: |
          echo "::notice::extracted=$DRIVE_RT_INFO raw length=${#RT} starts_with_1//=$([[ $RT == 1//* ]] && echo yes || echo no) has_space=$([[ $RT == *' '* ]] && echo yes || echo no) has_quote=$([[ $RT == *'"'* ]] && echo yes || echo no) client_id_set=$([ -n "$RCLONE_CONFIG_GDRIVE_CLIENT_ID" ] && echo yes || echo no)"
          python3 -c "
          import os,re
          r=os.environ['RT']
          shape=re.sub(r'[A-Za-z0-9_\-./]{6,}','X',r)
          print('::notice::shape=' + shape[:200])
          print('::notice::has refresh_token label=%s access_token label=%s starts=%r' % ('refresh_token' in r, 'access_token' in r, re.sub(r'[A-Za-z0-9]','a',r[:6])))
          "
          rclone lsd gdrive: -vv 2>&1 | grep -iE "error|invalid|unauthor|failed|denied|couldn" | sed -E 's/[A-Za-z0-9_\-]{30,}/[hidden]/g' | head -5 | while IFS= read -r l; do echo "::notice::$l"; done || true
          rclone lsd gdrive: >/dev/null 2>&1 && echo "::notice::LOGIN OK" || echo "::notice::LOGIN FAILED"
